<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <meta name="description" content="PSEUDO Y – Hero Preview">
  <title>PSEUDO Y · Hero Preview</title>
  <link rel="stylesheet" href="css/hero-v5.css?v=6">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="PSEUDO Y Startseite">
        <img class="brand-wordmark" src="assets/logo/pseudo-y-wordmark.webp" alt="PSEUDO Y">
      </a>
      <button class="menu-button" type="button" aria-label="Menü öffnen">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-copy">
        <h1 id="heroTitle">
          <span class="hero-line hero-line-one">
            <span id="heroLineOne" aria-label="Sensible Daten."></span><span class="hero-cursor hero-cursor-one" aria-hidden="true"></span>
          </span>
          <span class="hero-line hero-line-two">
            <span id="heroLineTwo" aria-label="Lokal vorbereitet für KI."></span><span class="hero-cursor hero-cursor-two" aria-hidden="true"></span>
          </span>
        </h1>
      </div>

      <div class="particle-arrow-wrap" aria-hidden="true">
        <canvas id="particleArrow"></canvas>
      </div>
    </section>
  </main>

  <script src="js/hero-v5.js?v=6" defer></script>
</body>
</html>
